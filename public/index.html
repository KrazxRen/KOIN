<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>KOIN</title>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <meta name="theme-color" content="#111111">
  <style>

:root {
  color-scheme: dark;

  --bg: #111318;
  --card: #1c2027;
  --input: #252a32;

  --ac: #f7b528;
  --ac-soft: #393522;

  --tx: #f4f4f0;
  --mut: #969ba5;
  --bd: #303640;

  --red: #ff7777;
  --green: #8bd9ae;

  --nav: #20242c;

  --radius: 20px;
  --radius-sm: 13px;

  --shadow: 0 8px 28px #00000020;
}

:root[data-theme="light"] {
  color-scheme: light;

  --bg: #f5f5f0;
  --card: #ffffff;
  --input: #f1f1ed;

  --ac: #f7b528;
  --ac-soft: #faf3d5;

  --tx: #202127;
  --mut: #777c85;
  --bd: #e8e8e2;

  --red: #df5252;
  --green: #318c5d;

  --nav: #ffffff;

  --shadow: 0 8px 28px #2424240b;
}

/* RESET */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 14px 'Plus Jakarta Sans', system-ui, sans-serif;
  transition: background .2s, color .2s;
}

[hidden] {
  display: none !important;
}

input, button {
  font-family: inherit;
}

button {
  cursor: pointer;
  -webkit-appearance: none;
}

[data-lucide] {
  width: 21px;
  height: 21px;
  stroke-width: 2;
  flex-shrink: 0;
}

/* APP CONTAINER */

#app, #auth {
  width: 100%;
  max-width: 480px;
  margin: auto;
  min-height: 100dvh;
}

#auth {
  padding:
    calc(env(safe-area-inset-top, 0px) + 90px)
    22px
    35px;
}

/* LOGO */

.logo {
  font-size: 43px;
  font-weight: 800;
  letter-spacing: -2px;
  color: var(--ac);
  margin: 0 0 32px;
}

/* HEADER */

header {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);

  width: 100%;
  max-width: 480px;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    calc(env(safe-area-inset-top, 0px) + 14px)
    20px
    13px;

  background: var(--bg);
  color: var(--tx);

  border-bottom: 1px solid var(--bd);

  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

#themeToggle {
  background: var(--card);
  color: var(--tx);

  border: 1px solid var(--bd);
  border-radius: 30px;

  padding: 8px 13px;

  font-size: 10px;
  font-weight: 800;
  letter-spacing: .8px;

  transition: background .2s;
}

#themeToggle:active {
  background: var(--ac);
  color: #242424;
}

/* MAIN CONTENT */

main {
  display: flex;
  flex-direction: column;

  min-height: 100dvh;

  padding:
    calc(env(safe-area-inset-top, 0px) + 82px)
    19px
    calc(env(safe-area-inset-bottom, 0px) + 120px);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 17px;

  animation: appear .22s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* FLOATING NAVIGATION */

nav {
  position: fixed;

  bottom: calc(env(safe-area-inset-bottom, 0px) + 13px);
  left: 50%;
  transform: translateX(-50%);

  width: calc(100% - 32px);
  max-width: 440px;

  z-index: 10;

  display: flex;
  align-items: center;
  justify-content: space-around;

  padding: 7px;

  background: var(--nav);

  border: 1px solid var(--bd);
  border-radius: 23px;

  box-shadow: 0 8px 30px #00000035;

  gap: 5px;
}

nav button {
  flex: 1;
  min-width: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;

  background: transparent;
  color: var(--mut);

  border: 0;
  border-radius: 17px;

  padding: 9px 5px 8px;

  font-size: 10px;
  font-weight: 700;

  transition:
    background .2s,
    color .2s,
    transform .15s;
}

nav button svg {
  width: 21px;
  height: 21px;
}

nav button span {
  display: block;
  font-size: 10px;
  margin: 0;
}

nav button.on {
  background: var(--ac);
  color: #242424;
}

nav button:active {
  transform: scale(.94);
}

/* CARDS */

.card {
  background: var(--card);

  border: 1px solid var(--bd);
  border-radius: var(--radius);

  padding: 19px;

  box-shadow: var(--shadow);
}

/* BALANCE */

.bal {
  position: relative;
  overflow: hidden;

  background: var(--ac);
  color: #29271e;

  border: 0;
  border-radius: 25px;

  padding: 24px 21px;

  box-shadow: none;
}

.bal::after {
  content: "";

  position: absolute;
  width: 145px;
  height: 145px;

  right: -50px;
  bottom: -75px;

  border-radius: 50%;
  background: #ffffff25;
}

.bal small {
  color: #625b3d;
  font-size: 12px;
  font-weight: 700;
}

.amt {
  position: relative;
  z-index: 1;

  margin-top: 12px;

  font-size: clamp(36px, 10vw, 49px);
  font-weight: 800;

  letter-spacing: -2.5px;
  line-height: 1.1;

  color: #29271e;
  overflow-wrap: anywhere;
}

.amt small {
  font-size: 11px;
  letter-spacing: .5px;
  color: #625b3d;
}

/* INPUTS */

input {
  width: 100%;

  padding: 14px 15px;
  margin: 6px 0;

  border: 1px solid var(--bd);
  border-radius: var(--radius-sm);

  background: var(--input);
  color: var(--tx);

  font-size: 14px;
  font-weight: 500;

  outline: none;

  transition:
    border-color .2s,
    box-shadow .2s;
}

input:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px var(--ac-soft);
}

input::placeholder {
  color: var(--mut);
  opacity: 1;
}

/* BUTTONS */

.btn {
  width: 100%;

  padding: 14px 17px;
  margin: 4px 0;

  border: 0;
  border-radius: 14px;

  background: var(--ac);
  color: #29271e;

  font-size: 14px;
  font-weight: 800;

  transition:
    transform .15s,
    opacity .15s,
    background .2s;
}

.btn:active {
  transform: scale(.97);
}

.btn.alt {
  background: var(--card);
  color: var(--tx);
  border: 1px solid var(--bd);
}

.btn:disabled {
  background: var(--bd);
  color: var(--mut);
  opacity: .65;
  cursor: not-allowed;
}

.btn.opt {
  display: flex;
  align-items: center;
  gap: 13px;

  text-align: left;

  padding: 18px;

  background: var(--card);
  color: var(--tx);

  border: 1px solid var(--bd);
  border-radius: 17px;

  font-size: 14px;
  font-weight: 700;

  box-shadow: none;
}

.btn.opt svg {
  color: var(--ac);
  width: 22px;
  height: 22px;
}

.btn.opt:active {
  background: var(--ac-soft);
}

/* HOME QUICK ACTIONS */

.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.quick-action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;

  padding: 16px 10px;

  background: var(--card);
  color: var(--tx);

  border: 1px solid var(--bd);
  border-radius: 16px;

  font-size: 13px;
  font-weight: 700;

  transition: transform .15s;
}

.quick-action svg {
  color: var(--ac);
  width: 19px;
  height: 19px;
}

.quick-action:active {
  transform: scale(.96);
}

/* NOTES */

.note {
  text-align: center;

  color: var(--mut);

  font-size: 12px;
  font-weight: 500;

  margin: 3px 0;
  line-height: 1.6;
}

/* ERRORS */

.err {
  color: var(--red);

  font-size: 12px;
  font-weight: 700;

  min-height: 18px;
  margin: 6px 0;
}

/* CHECKBOX */

.chk {
  display: flex;
  align-items: center;
  gap: 10px;

  color: var(--mut);

  margin: 12px 0;

  font-size: 12px;
}

.chk input {
  width: 17px;
  height: 17px;

  accent-color: var(--ac);
  margin: 0;
}

/* BACK AND LINK */

.back, .link {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  background: none;
  border: 0;

  color: var(--mut);

  font-size: 13px;
  font-weight: 700;

  padding: 9px 2px;
  text-align: left;
}

.back svg {
  width: 19px;
  height: 19px;
}

.back:active, .link:active {
  color: var(--ac);
}

.link {
  justify-content: center;
  width: 100%;
  margin-top: 4px;
}

/* VIDEO SCANNER */

video {
  width: 100%;

  border: 1px solid var(--bd);
  border-radius: 19px;

  background: #000;

  aspect-ratio: 1;
  object-fit: cover;
}

/* QR CODE */

#qr {
  background: #fff;

  border: 0;
  border-radius: 16px;

  padding: 15px;

  display: inline-block;
  box-shadow: var(--shadow);
}

#qr img {
  display: block;
  width: 240px;
  height: 240px;
  max-width: 100%;
}

/* TRANSACTION HISTORY */

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  padding: 15px 5px;

  border-bottom: 1px solid var(--bd);

  font-size: 12px;
  line-height: 1.7;

  overflow-wrap: anywhere;
}

li::before {
  content: "• ";
  color: var(--ac);
}

li.note::before {
  content: "";
}

/* PROFILE */

.prof {
  text-align: center;
  padding: 26px 20px;
}

.pfp {
  width: 82px;
  height: 82px;

  border: 0;
  border-radius: 25px;

  background: var(--ac);

  margin: 0 auto 15px;

  display: grid;
  place-items: center;
}

.pfp svg {
  width: 42px;
  height: 42px;
  fill: #29271e;
}

.prof h2 {
  margin: 8px 0;
  font-size: 18px;
  font-weight: 800;
}

.pwrow {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;

  color: var(--mut);
  font-size: 13px;
}

.ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: var(--input);
  border: 1px solid var(--bd);
  border-radius: 10px;

  color: var(--tx);

  padding: 7px;
}

.ico svg {
  width: 17px;
  height: 17px;
}

/* DEVELOPER INFO */

.dev {
  margin-top: auto;

  text-align: center;

  color: var(--mut);
  font-size: 11px;

  box-shadow: none;
  line-height: 1.8;
}

/* MODAL */

#modal {
  position: fixed;
  inset: 0;

  background: #0009;

  display: grid;
  place-items: center;

  padding: 20px;
  z-index: 20;

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

#modal .card {
  width: 100%;
  max-width: 400px;

  border-radius: 23px;
  padding: 22px;
}

#mt {
  font-size: 18px;
  font-weight: 800;
}

/* TOAST */

#toast {
  position: fixed;

  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);

  transform: translate(-50%, 12px);

  background: var(--ac);
  color: #29271e;

  border: 0;
  border-radius: 14px;

  box-shadow: 0 5px 20px #0003;

  padding: 12px 18px;

  opacity: 0;
  pointer-events: none;

  transition: .2s;
  z-index: 30;

  width: max-content;
  max-width: 90%;

  text-align: center;

  font-size: 12px;
  font-weight: 800;
}

#toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* DESKTOP */

@media (min-width: 481px) {
  body {
    border-left: 1px solid var(--bd);
    border-right: 1px solid var(--bd);
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

  </style>
</head>
<body>
<div id="auth" hidden>
 <h1 class="logo"><center>KOIN</center></h1>
 <div class="card">
  <input id="u" placeholder="Username" autocapitalize="none" autocomplete="username" spellcheck="false">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <label class="chk"><input id="rm" type="checkbox"> Remember me</label>
  <p id="aerr" class="err"></p>
  <button class="btn" onclick="enter('signup')">Sign up</button>
  <button class="btn alt" onclick="enter('login')">Log in</button>
 </div>
</div>

<div id="app" hidden>
 <header>
  <span>KOIN WALLET</span>
  <button id="themeToggle" type="button">LIGHT</button>
</header>
 <main>
<section id="home" class="tab">

  <div class="card bal">
    <small>Your balance</small>
    <div class="amt">
      <span id="bal">0.00</span>
      <small>KOINS</small>
    </div>
  </div>

  <div class="quick-actions">
    <button class="quick-action" onclick="sendOpen()">
      <i data-lucide="arrow-up-right"></i>
      Send
    </button>

    <button class="quick-action" onclick="recvOpen()">
      <i data-lucide="arrow-down-left"></i>
      Receive
    </button>
  </div>

  <div class="card">
    <h3 style="margin:0 0 5px;font-size:15px">
      Daily reward
    </h3>

    <p class="note" id="note" style="text-align:left">
      Earn KOINS once every day
    </p>

    <button id="earn" class="btn">
      Earn KOINS
    </button>
  </div>

</section>


  <section id="transfer" class="tab" hidden>
   <div id="t-menu">
    <button class="btn opt" onclick="sendOpen()">
      <i data-lucide="upload"></i>
      <span>&nbsp Send KOINS</span>
    </button>
    <button class="btn opt" onclick="recvOpen()">
      <i data-lucide="download"></i>
      <span>&nbsp Receive KOINS</span>
    </button>
    <button class="btn opt" onclick="histOpen()">
      <i data-lucide="rotate-ccw-clock"></i>
      <span>&nbsp Transaction History</span>
    </button>
   </div>
   <div id="t-send" hidden>
    <button class="back" onclick="sub('t-menu')">
      <i data-lucide="arrow-left"></i>
    </button>
    <video id="vid" playsinline muted hidden></video>
    <div class="card" id="manual"><input id="mcode" placeholder="Or paste a KOIN code" autocapitalize="none" spellcheck="false"><button class="btn alt" id="mgo">Use code</button></div>
    <div id="sendForm" class="card" hidden>
     <p>Send to <b id="to"></b></p>
     <input id="amt" inputmode="decimal" placeholder="Amount (e.g. 2.00)">
     <input id="spw" type="password" placeholder="Your password" autocomplete="current-password">
     <button class="btn" id="sendBtn">Send</button>
    </div>
   </div>
   <div id="t-recv" hidden>
    <button class="back" onclick="sub('t-menu')">
      <i data-lucide="arrow-left"></i>
    </button>
    <div class="card" style="text-align:center"><div id="qr"></div><p id="rname"><b></b></p><p id="rcode" class="note" style="word-break:break-all;user-select:all"></p><p class="note">Let the sender scan this code</p></div>
   </div>
   <div id="t-hist" hidden>
    <button class="back" onclick="sub('t-menu')">
      <i data-lucide="arrow-left"></i>
    </button>
    <ul id="hist"></ul>
   </div>
  </section>

  <section id="prof" class="tab" hidden>
   <div class="card prof">
    <div class="pfp"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></div>
    <h2 id="uname"></h2>
    <div class="pwrow"><span id="pwv">*******</span><button id="eye" class="ico" aria-label="Show password">
      <i data-lucide="eye"></i>
    </button></div>
   </div>
   <button class="btn alt" id="chU">Change username</button>
   <button class="btn alt" id="chP">Change password</button>
   <button class="link" id="lo">Log out</button>
   <div class="card dev"><b>KOIN</b> · v<span id="ver"></span><br>Developed by <span id="dev"></span></div>
  </section>
 </main>

<nav>

  <button data-t="home" class="on" aria-label="Home">
    <i data-lucide="house"></i>
    <span>Home</span>
  </button>

  <button data-t="transfer" aria-label="Transfer">
    <i data-lucide="arrow-left-right"></i>
    <span>Transfer</span>
  </button>

  <button data-t="prof" aria-label="Profile">
    <i data-lucide="user-round"></i>
    <span>Profile</span>
  </button>

</nav>

</div>

<div id="modal" hidden><div class="card"><h3 id="mt" style="margin-top:0"></h3><div id="mf"></div><p id="merr" class="err"></p>
 <button class="btn" id="ok">Save</button><button class="btn alt" onclick="$('#modal').hidden=true">Cancel</button></div></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const savedTheme = localStorage.getItem('koin-theme') || 'dark';

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('koin-theme', theme);

  const btn = $('#themeToggle');

  if (btn) {
    btn.textContent = theme === 'dark' ? 'LIGHT' : 'DARK';
    btn.setAttribute(
      'aria-label',
      'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'
    );
  }
}

setTheme(savedTheme);

$('#themeToggle').onclick = () => {
  setTheme(
    document.documentElement.dataset.theme === 'dark'
      ? 'light'
      : 'dark'
  );
};

const fmt = c => (c / 100).toFixed(2);
const VER = '2.0.0';
const DEV = 'KrazxRen';
let tok = localStorage.tok || sessionStorage.tok || null;
let S = null;
let pw = null;
let showPw = false;
let stream = null;
let scanning = false;
let to = null;
let tt;

function toast(m) {
  const t = $('#toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(tt);
  tt = setTimeout(() => t.classList.remove('on'), 2800);
}

async function api(p, b) {
  const r = await fetch('/api/' + p, {
    method: b ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
    body: b ? JSON.stringify(b) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && tok) {
    out();
    throw Error('Session expired, please log in');
  }
  if (!r.ok) throw Error(d.error || 'Something went wrong');
  return d;
}
  
function renderIcons() {
  lucide.createIcons();
}

renderIcons();
// ---- Login / logout ----
async function enter(kind) {
  try {
    const u = $('#u').value.trim();
    const p = $('#p').value;
    const rm = $('#rm').checked;
    const d = await api(kind, { username: u, password: p, remember: rm });
    tok = d.token;
    (rm ? localStorage : sessionStorage).tok = tok;
    pw = p;
    $('#aerr').textContent = '';
    await boot();
  } catch (e) {
    $('#aerr').textContent = e.message;
  }
}

function out(srv) {
  if (srv && tok) {
    fetch('/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + tok } }).catch(() => {});
  }
  localStorage.removeItem('tok');
  sessionStorage.removeItem('tok');
  tok = S = pw = null;
  showPw = false;
  stopScan();
  $('#app').hidden = true;
  $('#auth').hidden = false;
  $('#p').value = '';
}

async function boot() {
  await refresh();
  $('#auth').hidden = true;
  $('#app').hidden = false;
  $('#ver').textContent = VER;
  $('#dev').textContent = DEV;
  tab('home');
}

async function refresh() {
  S = await api('me');
  render();
}

function render() {
  $('#bal').textContent = fmt(S.balance);
  $('#earn').disabled = S.earned;
  $('#note').textContent = S.earned ? 'Already earned today, come back tomorrow' : 'Earn KOINS once every day';
  $('#uname').textContent = '@' + S.username;
  $('#pwv').textContent = showPw && pw !== null ? pw : '*******';
}

// ---- Navigation ----
function tab(n) {
  $$('.tab').forEach(e => {
    e.hidden = e.id !== n;
  });
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  if (n === 'transfer') sub('t-menu');
  else stopScan();
  refresh().catch(() => {});
}

$$('nav button').forEach(b => {
  b.onclick = () => tab(b.dataset.t);
});

function sub(id) {
  stopScan();
  $('#manual').hidden = false;
  ['t-menu', 't-send', 't-recv', 't-hist'].forEach(x => {
    $('#' + x).hidden = x !== id;
  });
  $('#sendForm').hidden = true;
}

// ---- Earn ----
$('#earn').onclick = async () => {
  try {
    const d = await api('earn', {});
    toast('+' + fmt(d.reward) + ' KOINS earned!');
  } catch (e) {
    toast(e.message);
  }
  refresh().catch(() => {});
};

// ---- Send (scan) ----
function sendOpen() {
  tab('transfer');
  sub('t-send');
  startScan();
}

async function startScan() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const v = $('#vid');
    v.hidden = false;
    v.srcObject = stream;
    await v.play();
    scanning = true;
    loop(v);
  } catch (e) {
    stopScan();
    toast(e.name === 'NotAllowedError' ? 'Allow camera access in your browser settings' : 'Camera problem: ' + (e.message || e.name));
  }
}

function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('#vid').hidden = true;
}

function loop(v) {
  let bd = null;
  try {
    if ('BarcodeDetector' in window) bd = new BarcodeDetector({ formats: ['qr_code'] });
  } catch {}
  const c = document.createElement('canvas');
  const x = c.getContext('2d', { willReadFrequently: true });
  let n = 0;
  let busy = false;
  let warned = false;
  if (!bd && !window.jsQR) toast('Scanner still loading. Try again, or paste the code below');

  (async function t() {
    if (!scanning) return;
    if (v.videoWidth && !busy && ++n % 2 === 0) {
      busy = true;
      let data = null;
      try {
        if (bd) {
          const r = await bd.detect(v);
          if (r.length) data = r[0].rawValue;
        } else if (window.jsQR) {
          const s = Math.min(1, 960 / v.videoWidth);
          c.width = v.videoWidth * s;
          c.height = v.videoHeight * s;
          x.drawImage(v, 0, 0, c.width, c.height);
          const k = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' });
          if (k) data = k.data;
        }
      } catch {}
      busy = false;
      if (data && data.startsWith('KOIN:')) {
        found(data.slice(5));
        return;
      }
      if (data && !warned) {
        warned = true;
        toast('That is not a KOIN code');
      }
    }
    requestAnimationFrame(t);
  })();
}

async function found(pid) {
  stopScan();
  try {
    const d = await api('lookup?pid=' + encodeURIComponent(pid));
    to = pid;
    $('#to').textContent = '@' + d.username;
    $('#sendForm').hidden = false;
  } catch (e) {
    toast(e.message);
    startScan();
  }
}

$('#sendBtn').onclick = async () => {
  try {
    const a = $('#amt').value.trim().replace(',', '.');
    await api('send', { pid: to, amount: a, password: $('#spw').value });
    toast('Sent ' + (+a).toFixed(2) + ' KOINS to ' + $('#to').textContent);
    $('#amt').value = '';
    $('#spw').value = '';
    sub('t-menu');
    refresh().catch(() => {});
  } catch (e) {
    toast(e.message);
  }
};

$('#mgo').onclick = () => {
  const v = $('#mcode').value.trim().replace(/^KOIN:/i, '');
  if (v) {
    $('#manual').hidden = true;
    found(v);
  }
};

// ---- Receive ----
function recvOpen() {
  if (!window.qrcode) {
    return toast('Still loading, try again in a moment');
  }

  tab('transfer');
  sub('t-recv');

  const q = qrcode(0, 'M');
  q.addData('KOIN:' + S.pid);
  q.make();

  $('#qr').innerHTML = q.createImgTag(8, 4);
  $('#rname').textContent = '@' + S.username;
  $('#rcode').textContent = 'KOIN:' + S.pid;
}

// ---- History ----
async function histOpen() {
  sub('t-hist');
  const ul = $('#hist');
  ul.innerHTML = '';
  try {
    const l = await api('history');
    if (!l.length) ul.innerHTML = '<li class="note">No transactions yet</li>';
    const z = n => String(n).padStart(2, '0');
    l.forEach(x => {
      const d = new Date(x.at);
      const li = document.createElement('li');
      const date = `[${z(d.getDate())}-${z(d.getMonth() + 1)}-${d.getFullYear()}]`;
      const time = `(${z(d.getHours())}:${z(d.getMinutes())})`;
      const verb = x.sent ? 'sent' : 'received';
      const prep = x.sent ? 'to' : 'from';
      li.textContent = `${date} ${time} : ${verb} ${fmt(x.amount)} KOINS ${prep} @${x.who}`;
      ul.append(li);
    });
  } catch (e) {
    toast(e.message);
  }
}

// ---- Me ----
$('#eye').onclick = () => {
  if (pw === null) return toast('For security, your password can only be shown right after you log in');
  showPw = !showPw;
  render();
};

function ask(title, fields, go) {
  $('#mt').textContent = title;
  $('#mf').innerHTML = '';
  $('#merr').textContent = '';
  fields.forEach(([ph, type]) => {
    const i = document.createElement('input');
    i.placeholder = ph;
    i.type = type || 'text';
    i.autocomplete = 'off';
    i.autocapitalize = 'none';
    $('#mf').append(i);
  });
  $('#modal').hidden = false;
  $('#ok').onclick = async () => {
    try {
      await go([...$('#mf').children].map(i => i.value));
      $('#modal').hidden = true;
    } catch (e) {
      $('#merr').textContent = e.message;
    }
  };
}

$('#chU').onclick = () => ask('Change username', [['New username'], ['Current password', 'password']], async ([n, p]) => {
  await api('username', { username: n.trim(), password: p });
  await refresh();
  toast('Username changed');
});

$('#chP').onclick = () => ask('Change password', [['Current password', 'password'], ['New password', 'password']], async ([o, n]) => {
  await api('password', { password: o, newPassword: n });
  pw = n;
  render();
  toast('Password changed');
});

$('#lo').onclick = () => out(true);

// ---- Start ----
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

if (tok) {
  boot().catch(() => {
    $('#auth').hidden = false;
  });
} else {
  $('#auth').hidden = false;
}
  
</script>
